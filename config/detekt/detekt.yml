# detekt's shared config, applied by every module through the `minion.detekt` convention plugin
# (build-logic/convention/src/main/kotlin/minion.detekt.gradle.kts).
#
# buildUponDefaultConfig is false, so ONLY the rules listed below are active — detekt's ~150
# default-active rules stay off. This is a deliberate first pass, not the full rule set: each
# addition below is chosen because it enforces a convention this repo already states in writing
# (see CLAUDE.md), not because it is a detekt default. Add to it deliberately, the same way.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

# LongMethod / LongParameterList / CyclomaticComplexMethod / NestedBlockDepth: a ceiling on the
# natural complexity magnets in this codebase — ViewModels, use cases, and parsers (EMV framing,
# OCR reading-order reconstruction). Left at their own default thresholds for a first pass.
#
# LongMethod does not apply to `@Composable`. A composable is a declarative description of a UI
# tree, so its length tracks how much screen it describes rather than how much logic it holds —
# the same layout as XML would run longer still and nothing would flag it. 35 of the rule's 37
# findings were composables; the two that were not are parser code and were shortened instead.
#
# LongParameterList keeps `@Composable` deliberately: a composable taking a dozen *required*
# arguments is the signal that its state wants to be one object, and that is worth hearing. What
# it does not count is parameters with defaults (`ignoreDefaultParameters`) — the rule is about
# what a function demands of its callers, and a defaulted parameter demands nothing — nor
# `@Inject` constructors, where the count is a measure of how many collaborators a ViewModel
# legitimately needs and Hilt supplies every one of them.
complexity:
  active: true
  LongMethod:
    active: true
    ignoreAnnotated: ['Composable']
  LongParameterList:
    active: true
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Inject']
  CyclomaticComplexMethod:
    active: true
    ignoreSingleWhenExpression: true
  NestedBlockDepth:
    active: true

# ElseCaseInsteadOfExhaustiveWhen: flags a when-expression that falls back to `else` instead of
# being exhaustive over a sealed type. The MVI contract depends on `onIntent`'s `when` and every
# `DomainError` handler staying exhaustive — an `else` branch is exactly how a new UiIntent or a
# new DomainError case goes unhandled without the compiler ever objecting.
#
# UnsafeCallOnNullableType / UnsafeCast: ban `!!` and an unchecked `as` cast. General null-safety
# and type-safety hygiene, and directly relevant wherever the sealed `ScannedContent`/comparison
# hierarchies do type dispatch.
potential-bugs:
  active: true
  ElseCaseInsteadOfExhaustiveWhen:
    active: true
  UnsafeCallOnNullableType:
    active: true
  UnsafeCast:
    active: true

# TooGenericExceptionCaught: flags `catch (e: Exception)` / `catch (e: Throwable)`. safeCall
# (:core:network) is the one sanctioned place that catches broadly, and only because it rethrows
# CancellationException first — see CLAUDE.md's Error handling section. A bare catch anywhere else
# is the pattern that section warns against: it turns a cancelled screen's request into a spurious
# failure.
#
# NotImplementedDeclaration: flags a leftover TODO()/error("not implemented") — the state a
# feature scaffolded by scripts/scaffold_feature.py is in until its use cases are filled in.
# Catches one left behind before it merges.
exceptions:
  active: true
  TooGenericExceptionCaught:
    active: true
  NotImplementedDeclaration:
    active: true

coroutines:
  active: true
  # InjectDispatcher: flags a hardcoded Dispatchers.IO/.Default/etc. call site instead of an
  # injected dispatcher. :core:common exists specifically to provide dispatcher qualifiers for
  # this reason.
  InjectDispatcher:
    active: true
  # SuspendFunSwallowedCancellation: flags a suspend function that catches broadly without
  # rethrowing CancellationException. The exact mistake safeCall and
  # RemoteConfigFeatureFlagRepository are both written to avoid.
  SuspendFunSwallowedCancellation:
    active: true
  # GlobalCoroutineUsage: flags GlobalScope.launch/.async. Bypasses both structured concurrency
  # and the injected-dispatcher convention InjectDispatcher enforces above.
  GlobalCoroutineUsage:
    active: true
  # SleepInsteadOfDelay: Thread.sleep() inside a coroutine blocks the underlying thread instead of
  # suspending. Worth watching given the sensor-timing code in level/soundmeter/speedometer.
  SleepInsteadOfDelay:
    active: true
  # RedundantSuspendModifier: a `suspend fun` that never actually suspends. Hygiene.
  RedundantSuspendModifier:
    active: true

# EmptyCatchBlock: an empty catch body silently swallows whatever it caught — the exact opposite
# of the DomainError pipeline, where every failure is meant to reach the screen as something.
# EmptyFunctionBlock / EmptyWhenBlock: stub bodies left behind, most likely from a scaffolded
# feature whose use cases were never filled in.
empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
  EmptyFunctionBlock:
    active: true
  EmptyWhenBlock:
    active: true

# SpreadOperator / ForEachOnRange / CouldBeSequence: allocation-heavy patterns that matter most in
# this repo's hot numeric paths — :core:gnss's geoid interpolation (checked at a hundred thousand
# points), :core:sound's per-sample weighting filters, :core:emv's byte-level CRC work.
performance:
  active: true
  SpreadOperator:
    active: true
  ForEachOnRange:
    active: true
  CouldBeSequence:
    active: true

# UndocumentedPublicClass / UndocumentedPublicFunction: guards the KDoc coverage this repo already
# built up module by module (see the `docs(...)` commit history) against regression. Low noise
# given how little is actually public — everything in a feature module is `internal` except its
# navigation entry point, so this only ever touches genuine public API surface.
#
# `searchInInnerObject: false` exempts companion objects, which accounted for 23 of the rule's 32
# findings. The keyword is not API surface: the enclosing class is documented and so are the
# constants inside, and the only thing a KDoc block on `companion object` itself could say is that
# it is one. The nested types and functions the rule flagged for real were documented instead.
comments:
  active: true
  UndocumentedPublicClass:
    active: true
    searchInInnerObject: false
  UndocumentedPublicFunction:
    active: true

# MagicNumber is off. It was enabled on the theory that it would earn its place in the pure-Kotlin
# algorithm modules, where an unnamed constant in a checksum or a threshold is a correctness risk
# rather than a style nit. Run against the codebase it reported 230 findings and that theory did not
# survive them: :core:emv, :core:gnss and :core:sound account for 18 between them, while four
# categories that cannot be fixed account for 161.
#
#  - **The palette, 53** — every `Color(0xFF0E1017)` in the designsystem's Color.kt. The rule this
#    repo actually has is that colours come from `MaterialTheme.colorScheme` rather than a literal
#    at a call site; Color.kt is where that scheme is defined, so the hex *is* the definition and
#    there is nowhere further to hoist it.
#  - **Spec-defined codes, ~35** — WMO weather codes (`95, 96, 99 -> THUNDERSTORM`), EMV tag ranges,
#    HTTP statuses. The `when` arm already names the number; a constant would say it twice.
#  - **Binary format constants, 47** — all of :core:exif. Byte masks, `shr 8/16/24` bit positions,
#    and MinimalExif's hand-built EXIF header, where every byte of the format is a finding.
#  - **@Preview sample data, 36** — which this file's own conventions exempt outright.
#
# What is left is mostly self-evident geometry — `degrees % 360.0`, `/ 90.0` — and `spacing / 4`,
# the derived-spacing idiom CLAUDE.md recommends by name. A rule whose output is four fifths things
# that must not change is not a rule that is teaching anything.
#
# UnusedImports / UnusedParameter / UnusedPrivateProperty / UnusedPrivateMember: plain dead-code
# hygiene, near-zero false-positive risk. UnusedPrivateMember stands in for "unused private
# function" — detekt 1.23.8 has no separate UnusedPrivateFunction rule; UnusedPrivateMember is the
# one that needs type resolution to catch an unused private function, and detekt's own shipped
# defaults run it alongside UnusedPrivateProperty rather than instead of it, so this does the same.
# UnusedImports itself ships inactive in detekt's own defaults; turned on here deliberately.
#
# WildcardImport / VarCouldBeVal: idiomatic-Kotlin nudges, cheap.
#
# UseDataClass is off. Every one of its six findings was a class that must not be a data class, and
# it produced no true positive at all. Four hold an array — `CapturedFrame`, `CaptureResult.Success`,
# `StripOperation.Insert`, `AudioBlock` — where a generated `equals` compares references while
# reading like it compares content; `Insert` writes `contentEquals` out by hand for exactly that
# reason and is flagged anyway. The other two are `@Inject` use cases whose only state is the
# repository they delegate to, where `copy()` on a service object is meaningless. The rule cannot
# see the one thing that decides the question, which is whether the type has value semantics.
style:
  active: true
  MagicNumber:
    active: false
  UnusedImports:
    active: true
  UnusedParameter:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedPrivateMember:
    active: true
  WildcardImport:
    active: true
  VarCouldBeVal:
    active: true
  UseDataClass:
    active: false
