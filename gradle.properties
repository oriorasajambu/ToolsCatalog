# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Daemon heap. The default 2 GB is a single-module figure and this build is 34 modules: KSP runs in
# 17 of them, Hilt generates a component graph spanning all of them, and R8 processes the lot in one
# pass on a release build. At 2 GB that fits only by collecting continuously, which shows up as a
# build that is slow without any one task being slow. Metaspace is raised for the same reason — KSP
# and the Kotlin compiler load a great many classes.
#
# The Kotlin compile daemon is a separate process and does NOT inherit the line above; without its
# own setting it runs on the JVM default, which is a fraction of what a 34-module compile needs.
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g

# Build the independent modules at the same time. 14 of the 34 modules are pure Kotlin and depend
# on nothing but :core:common, so a serial build leaves almost every core idle.
#
# The warning this setting usually carries — "only for decoupled projects" — is about builds where
# one project reads another's model during configuration. This one never does: the convention
# plugins live in an included build (build-logic), and module build files only declare
# dependencies. Enabling it is safe here for a structural reason, not by experiment.
org.gradle.parallel=true

# Reuse task outputs across builds, keyed by their inputs. What this actually buys is the
# debug <-> release and development <-> production switch: without it, every switch recompiles the
# half of the graph that did not change, because the previous variant's outputs were overwritten.
org.gradle.caching=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=37.1
