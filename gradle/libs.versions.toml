[versions]
androidGradlePlugin = "9.2.1"
kotlin = "2.4.0"
ksp = "2.3.10"
detekt = "1.23.8"
retrofit = "3.0.0"
coroutines = "1.11.0"
chucker = "4.3.1"
hilt = "2.60.1"
hilt-compiler = "1.4.0"
showkase = "1.0.5"
activity = "1.13.0"
lifecycle = "2.11.0"
flowbinding = "1.2.0"
lottie-compose = "6.7.1"
coil-compose = "3.5.0"
datastore = "1.2.1"
# 1.1.1, not the 1.2.0 SPEC.md pencilled in: 1.2.0 never shipped stable — the line stops at
# 1.2.0-rc01 and the next release is 1.3.0-alpha02. Every other dependency here is pinned to a
# stable release, so this one is too.
glance = "1.1.1"
hilt-navigation-compose = "1.4.0"
pagingCommon = "3.5.0"
pagingCompose = "3.5.0"
material3 = "1.4.0"
google-material = "1.14.0"
android-core = "1.19.0"
android-compat = "1.7.1"
android-annotation = "1.10.0"
compose-bom = "2026.06.01"
compose-navigation = "2.9.8"
kotlin-serializable = "1.11.0"
desugar = "2.1.5"
constraint-layout = "1.1.1"
okhttp = "5.4.0"
gson = "2.14.0"
tink = "1.23.0"
junit = "4.13.2"
test-junit = "1.3.0"
espresso = "3.7.0"
arch-core = "2.2.0"
mockk = "1.14.11"
turbine = "1.2.1"
room = "2.8.4"
work = "2.11.2"
hilt-work = "1.4.0"
camerax = "1.5.0"
mlkit-barcode = "17.3.0"
mlkit-text = "16.0.1"
onnxruntime = "1.27.0"
zxing = "3.5.3"
firebase-bom = "34.18.0"
google-services = "4.5.0"
firebase-crashlytics-plugin = "3.0.8"

[libraries]
desugar-jdk = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }
kotlin-stdlib = { group = "org.jetbrains.kotlin", name = "kotlin-stdlib", version.ref = "kotlin" }
# @Qualifier / @Inject for the pure-Kotlin modules, which cannot depend on Hilt.
javax-inject = { group = "javax.inject", name = "javax.inject", version = "1" }

# Android Jetpack
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "android-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "android-compat" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version = "1.0.1" }
# Reads the orientation tag a camera writes into a JPEG, so a photo taken sideways is uprighted
# before recognition rather than being fed to the model rotated.
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version = "1.4.1" }
# Annotations only, no code — a plain JVM jar, so the pure-Kotlin modules can use it too.
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "android-annotation" }

# Compose
google-material = { group = "com.google.android.material", name = "material", version.ref = "google-material" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-material2 = { group = "androidx.compose.material", name = "material" }
compose-material-icon-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
compose-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
compose-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-debug = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-test-junit = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-constraint-layout = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraint-layout" }
compose-lottie = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie-compose" }
compose-coil = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil-compose" }
compose-coil-network = { group = "io.coil-kt.coil3", name = "coil-network-okhttp", version.ref = "coil-compose" }
compose-coil-svg = { group = "io.coil-kt.coil3", name = "coil-svg", version.ref = "coil-compose" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
compose-hilt-navigation = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
compose-navigation = { group = "androidx.navigation", name = "navigation-compose", version.ref = "compose-navigation" }
kotlin-serializable = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlin-serializable" }
compose-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }

# Networking
okhttp-urlconnection = { group = "com.squareup.okhttp3", name = "okhttp-urlconnection", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
chucker = { group = "com.github.chuckerteam.chucker", name = "library", version.ref = "chucker" }
chucker-noop = { group = "com.github.chuckerteam.chucker", name = "library-no-op", version.ref = "chucker" }

# Reactive
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect", version.ref = "kotlin" }
flowbinding-android = { group = "io.github.reactivecircus.flowbinding", name = "flowbinding-android", version.ref = "flowbinding" }

# Home-screen widget. glance-material3 is what supplies GlanceTheme and the dynamic-colour
# providers; glance-appwidget is the Glance surface itself.
glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }

# Security
data-store = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore"}
tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink"}

# Persistence — Room is the source of truth; the server is a replica.
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }

# Background sync — SyncWorker drains the outbox.
work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }
hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "hilt-work" }

# Camera + barcode decoding.
# ML Kit's bundled model, not the Play-Services-delivered one: the tool has to work on a device
# with no Play Services, and a first scan must not block on a model download.
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-barcode = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkit-barcode" }
# Latin script only. The other scripts (Chinese, Devanagari, Japanese, Korean) are separate
# artifacts of about the same size — and ML Kit cannot auto-detect which script an image holds, so
# adding one means adding a script picker to the UI, not just a dependency.
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkit-text" }
# Runs the PaddleOCR PP-OCRv5 models, the alternative to ML Kit above. Ships native libraries per
# ABI, which is why :app filters down to the two ARM ones — see its `ndk` block. Version matched to
# ente-io/mobile_ocr, whose pipeline this repo vendors; the models were exported against it.
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
# Encoding only. ML Kit reads QR codes and cannot write one, which is what redrawing a scanned
# payload needs. Pure Java `core`, not `zxing-android-embedded` — none of that library's Activity
# and camera machinery is wanted here.
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
# Just the `Task` async primitive that ML Kit's API returns — not the Play Services runtime, which
# this app deliberately does not require. Declared explicitly so `:core:camera` can own the one
# `Task.await()` both ML Kit consumers share, rather than each keeping its own copy.
play-services-tasks = { group = "com.google.android.gms", name = "play-services-tasks", version = "18.3.0" }

# Firebase
# The BOM is the only place a Firebase version is written; the product artifacts below are declared
# without one and take theirs from it, so the set can never be mixed across releases.
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
# Analytics is not optional here even though nothing calls it: Crashlytics uses its session
# information for crash-free-user metrics, and Remote Config uses its user properties for
# targeting. Dropping it silently degrades both.
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-config = { group = "com.google.firebase", name = "firebase-config" }
# `Task.await()`, so a Remote Config fetch is a suspend call rather than a callback. Versioned with
# the coroutines library, not with Play Services.
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Lifecycle
androidx-lifecycle-viewmodel ={ group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
androidx-lifecycle-commonJava8 = { group = "androidx.lifecycle", name = "lifecycle-common-java8", version.ref = "lifecycle" }

# Testing
showkase = { module = "com.airbnb.android:showkase", version.ref = "showkase" }
showkase-processor = { module = "com.airbnb.android:showkase-processor", version.ref = "showkase" }
showkase-annotation = { module = "com.airbnb.android:showkase-annotation", version.ref = "showkase" }
test-junit = { group = "junit", name = "junit", version.ref = "junit" }
test-androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "test-junit" }
test-androidx-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
test-androidx-core = { group = "androidx.arch.core", name = "core-testing", version.ref = "arch-core" }
test-mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
test-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
test-turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

# Dependency Injection
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-androidx-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hilt-compiler" }

# Dependencies of the included build-logic.
# These put each plugin on build-logic's compile classpath so the convention plugins can apply
# them by id and configure their extensions with type-safe accessors.
android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "androidGradlePlugin" }
kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { group = "com.google.devtools.ksp", name = "com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }
hilt-gradlePlugin = { group = "com.google.dagger", name = "hilt-android-gradle-plugin", version.ref = "hilt" }
compose-gradlePlugin = { group = "org.jetbrains.kotlin", name = "compose-compiler-gradle-plugin", version.ref = "kotlin" }
google-services-gradlePlugin = { group = "com.google.gms", name = "google-services", version.ref = "google-services" }
firebase-crashlytics-gradlePlugin = { group = "com.google.firebase", name = "firebase-crashlytics-gradle", version.ref = "firebase-crashlytics-plugin" }
detekt-gradlePlugin = { group = "io.gitlab.arturbosch.detekt", name = "detekt-gradle-plugin", version.ref = "detekt" }

# DataStore
datastore-preferences-rxjava3 = { group = "androidx.datastore", name = "datastore-preferences-rxjava3", version.ref = "datastore" }

# Paging
compose-paging-common = { group = "androidx.paging", name = "paging-common", version.ref = "pagingCommon" }
compose-paging = { group = "androidx.paging", name = "paging-compose", version.ref = "pagingCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
gradle = { id = "com.android.tools.build:gradle", version.ref = "androidGradlePlugin" }
android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-serializable = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

# Plugins defined by this project
minion-android-library = { id = "minion.android.library" }

[bundles]
glance = [
    "glance-appwidget",
    "glance-material3",
]

jetpack = [
    "androidx-core",
    "androidx-appcompat",
    "kotlin-serializable",
]

compose = [
    "google-material",
    "compose-material2",
    "compose-material3",
    "compose-material-icons-core",
    "compose-material-icon-extended",
    "compose-activity",
    "compose-viewmodel",
    "compose-preview",
    "compose-runtime",
    "compose-ui",
    "compose-ui-graphics",
    "compose-constraint-layout",
    "compose-lottie",
    "compose-coil",
    "compose-coil-network",
    "compose-coil-svg",
    "compose-hilt-navigation",
    "compose-paging",
    "compose-navigation",
    "compose-livedata",
]

lifecycle = [
    "androidx-lifecycle-livedata",
    "androidx-lifecycle-viewmodel",
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-process",
    "androidx-lifecycle-service",
    "androidx-lifecycle-commonJava8"
]

reactive = [
    "coroutines-core",
    "coroutines-android",
    "flowbinding-android",
    "kotlin-reflect"
]

networking = [
    "okhttp-urlconnection",
    "okhttp-logging",
    "retrofit-core",
    "retrofit-converter-gson",
    "gson"
]

unit-test = [
    "test-junit",
    "test-mockk",
    "test-coroutines",
    "test-turbine",
    "test-androidx-core"
]

# For pure-Kotlin modules. Identical to unit-test minus androidx arch-core, which is an AAR and
# cannot be resolved by a JVM module.
unit-test-jvm = [
    "test-junit",
    "test-mockk",
    "test-coroutines",
    "test-turbine"
]

instrumentation-test = [
    "test-androidx-junit",
    "test-androidx-espresso"
]

# Consumed only by :feature:qrscan. Deliberately not in the feature convention plugin — one
# consumer does not justify putting CameraX on every future feature's classpath.
# Applied only to :app — Firebase reads google-services.json, which is application identity, so a
# library module depending on it would be depending on which app it is built into.
firebase = [
    "firebase-analytics",
    "firebase-crashlytics",
    "firebase-config",
    "coroutines-play-services"
]

camera = [
    "camera-core",
    "camera-camera2",
    "camera-lifecycle",
    "camera-view"
]
